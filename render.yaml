services:
  - type: web
    name: social-ai-dashboard
    env: python
    buildCommand: ""
    startCommand: honcho start
    envVars:
      - key: PORT
        value: 10000

  - type: web
    name: social-ai-gateway
    env: python
    buildCommand: ""
    startCommand: /opt/render/project/src/tools/picoclaw gateway
    envVars:
      - key: PORT
        value: 18800

{% extends "base.html" %}

{% block title %}Criar Post com IA - Social AI{% endblock %}

{% block content %}
<div class="space-y-8 max-w-5xl mx-auto">
    
    <div class="text-center md:text-left border-b border-gray-800 pb-5">
        <h1 class="text-3xl font-bold text-white tracking-wide flex items-center justify-center md:justify-start gap-2">
            🤖 Gerador IA
        </h1>
        <p class="text-sm text-gray-400 mt-2">Preencha os parâmetros abaixo para que nossa inteligência artificial monte a sua publicação perfeita.</p>
    </div>

    <form method="POST" enctype="multipart/form-data" class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
        
        <div class="bg-gray-800 border border-gray-700/70 rounded-2xl p-6 shadow-xl space-y-5 md:col-span-2">
            <div class="flex items-center space-x-2 border-b border-gray-700/50 pb-3">
                <i class="fa-solid fa-sliders text-blue-400 text-lg"></i>
                <h2 class="text-lg font-bold text-gray-200">Parâmetros do Conteúdo</h2>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="space-y-2 sm:col-span-2">
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider block">Tema do Post</label>
                    <input type="text" name="tema" placeholder="Ex: O Raio-X do MEI ou Mapeamento Inteligente..." required
                        class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition-all text-sm">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider block">Rede Social</label>
                    <select name="rede_social" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition-all text-sm cursor-pointer">
                        <option value="LinkedIn">LinkedIn</option>
                        <option value="Instagram">Instagram</option>
                    </select>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider block">Modo de Escrita</label>
                    <select name="modo" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition-all text-sm cursor-pointer">
                        <option value="Viral">Viral</option>
                        <option value="Corporativo">Corporativo / Sério</option>
                        <option value="Educacional">Educacional / Técnico</option>
                        <option value="Vendas">Focado em Vendas</option>
                    </select>
                </div>

                <div class="space-y-2 sm:col-span-2">
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider block">Nicho / Segmento</label>
                    <input type="text" name="nicho" placeholder="Ex: Contabilidade, Estética, Perfumaria..." required
                        class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition-all text-sm">
                </div>
            </div>
        </div>

        <div class="space-y-6">
            
            <div class="bg-gray-800 border border-gray-700/70 rounded-2xl p-6 shadow-xl space-y-4">
                <div class="flex items-center space-x-2 border-b border-gray-700/50 pb-3">
                    <i class="fa-regular fa-calendar-days text-indigo-400 text-lg"></i>
                    <h2 class="text-lg font-bold text-gray-200">Agendamento</h2>
                </div>

                <div class="space-y-4">
                    <div class="space-y-2">
                        <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider block">Data da Postagem</label>
                        <input type="date" name="data_postagem" required
                            class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 transition-all text-sm cursor-pointer">
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider block">Horário de Envio</label>
                        <input type="time" name="horario" required
                            class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 transition-all text-sm cursor-pointer">
                    </div>
                </div>
            </div>

            <div class="bg-gray-800 border border-gray-700/70 rounded-2xl p-6 shadow-xl space-y-5">
                <div class="flex items-center space-x-2 border-b border-gray-700/50 pb-3">
                    <i class="fa-regular fa-image text-emerald-400 text-lg"></i>
                    <h2 class="text-lg font-bold text-gray-200">Mídia do Post</h2>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider block">Imagem de Fundo</label>
                    <label class="flex flex-col items-center justify-center w-full h-24 border-2 border-gray-700 border-dashed rounded-xl cursor-pointer bg-gray-900/50 hover:bg-gray-900 hover:border-gray-500 transition-all group">
                        <div class="flex flex-col items-center justify-center pt-3 pb-3 text-center px-2">
                            <i class="fa-solid fa-cloud-arrow-up text-gray-500 group-hover:text-gray-300 text-xl mb-1 transition-all"></i>
                            <p class="text-xs text-gray-400 font-medium group-hover:text-gray-200 transition-all">Clique para selecionar</p>
                            <p class="text-[10px] text-gray-500 mt-0.5">PNG, JPG ou JPEG</p>
                        </div>
                        <input type="file" name="imagem" class="hidden" accept="image/*" />
                    </label>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-lg shadow-blue-500/20 flex items-center justify-center space-x-2 text-sm uppercase tracking-wider">
                        <i class="fa-solid fa-rocket animate-pulse"></i>
                        <span>Gerar Conteúdo</span>
                    </button>
                </div>
            </div>

        </div>
    </form>
</div>
{% endblock %}
